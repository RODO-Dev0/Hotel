<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1512">
<title>Hotel</title>
<!-- Built by RODO_Dev -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Vazirmatn:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1512;--panel:#16201b;--panel2:#1d2a23;--line:#2b3b32;--brass:#c9a56a;--ivory:#f1ece1;--mute:#9aa79f;--bad:#d46a5e;--ok:#6cbf8a;--r:14px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:70px;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ivory);font:400 16px/1.6 'Vazirmatn',system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:'Cormorant Garamond','Vazirmatn',serif;font-weight:600;line-height:1.1}
a{color:inherit;text-decoration:none}
img{display:block;width:100%;height:100%;object-fit:cover}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.ico{width:1.25em;height:1.25em;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.25em;flex:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.btn{background:var(--brass);color:#1a1409;border:0;padding:12px 24px;border-radius:999px;font-weight:600;cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(201,165,106,.28)}
.btn:active{transform:none}
.btn.ghost{background:transparent;color:var(--ivory);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--brass)}
.btn.sm{padding:6px 14px;font-size:14px;min-height:36px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad);box-shadow:none}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
/* nav */
nav{position:fixed;inset:0 0 auto 0;z-index:30;transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
nav.sc{background:rgba(14,21,18,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-color:var(--line)}
nav .wrap{display:flex;align-items:center;gap:18px;height:68px}
.logo{font-family:'Cormorant Garamond',serif;font-size:27px;font-weight:700;margin-inline-end:auto;color:var(--brass);display:flex;align-items:center;gap:8px}
nav a.l{color:#d8d3c5;font-size:15px;position:relative}
nav a.l:after{content:"";position:absolute;inset:auto 0 -4px 0;height:1px;background:var(--brass);transform:scaleX(0);transition:transform .25s}
nav a.l:hover:after{transform:scaleX(1)}
select.lang{background:rgba(22,32,27,.8);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:36px}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:10px;width:42px;height:42px;cursor:pointer;align-items:center;justify-content:center}
@media(max-width:900px){nav a.l{display:none}.burger{display:inline-flex}
 nav.open{background:rgba(14,21,18,.97)}
 nav.open .menu{display:flex}}
.menu{display:none;position:absolute;top:68px;inset-inline:0;flex-direction:column;background:rgba(14,21,18,.97);border-bottom:1px solid var(--line);padding:10px 20px 18px}
.menu a{padding:13px 4px;border-bottom:1px solid var(--line);font-size:17px}
/* hero */
.hero{min-height:100svh;position:relative;display:flex;align-items:flex-end;padding:110px 0 36px;background:linear-gradient(135deg,#1d2a23,#0e1512);overflow:hidden}
.hero .bg{position:absolute;inset:0;animation:kb 22s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.09) translate(-1%,-1%)}}
.hero .bg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,21,18,.55),rgba(14,21,18,.2) 38%,rgba(14,21,18,.96))}
.hero .wrap{position:relative;width:100%}
.hero h1{font-size:clamp(44px,9vw,112px);animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.hero .stars{color:var(--brass);display:flex;gap:4px;margin-bottom:12px;animation:rise .9s both}
.hero p.sub{max-width:580px;color:#e2ddcf;font-size:clamp(16px,2vw,19px);margin:14px 0 28px;animation:rise .9s .15s cubic-bezier(.2,.7,.2,1) both}
.hero .bar{animation:rise .9s .3s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.bar{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:10px;background:rgba(22,32,27,.9);border:1px solid var(--line);border-radius:var(--r);padding:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);align-items:end}
.bar label{display:block;font-size:13px;color:var(--mute);margin-bottom:2px}
.bar input,.bar select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px}
@media(max-width:900px){.bar{grid-template-columns:1fr 1fr}.bar .btn{grid-column:1/-1}}
@media(max-width:420px){.bar{grid-template-columns:1fr}}
.scrollcue{position:absolute;bottom:14px;inset-inline-end:20px;color:var(--mute);animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(6px)}}
@media(max-width:900px){.scrollcue{display:none}}
/* reveal */
.rv{opacity:0;transform:translateY(28px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}
/* sections */
section{padding:clamp(60px,9vw,100px) 0}
.h{font-size:clamp(34px,5vw,58px);margin-bottom:12px}
.h:after{content:"";display:block;width:56px;height:2px;background:var(--brass);margin-top:14px;transform-origin:left;transition:width .6s}
[dir=rtl] .h:after{transform-origin:right}
.lead{color:var(--mute);max-width:620px;margin-bottom:36px}
.lead:empty{margin-bottom:26px}
.times{display:flex;gap:clamp(18px,5vw,50px);flex-wrap:wrap;border-block:1px solid var(--line);padding:22px 0;margin-top:6px}
.times div{display:flex;align-items:center;gap:12px}
.times .ico{width:28px;height:28px;color:var(--brass)}
.times b{font:600 26px 'Cormorant Garamond',serif;display:block;line-height:1.1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:transform .35s,border-color .35s,box-shadow .35s}
.card:hover{transform:translateY(-6px);border-color:var(--brass);box-shadow:0 18px 40px rgba(0,0,0,.35)}
.card .ph{aspect-ratio:4/3;background:linear-gradient(135deg,var(--panel2),#0e1512);overflow:hidden}
.card .ph img{transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.card:hover .ph img{transform:scale(1.07)}
.card .bd{padding:18px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-size:27px}
.price{font:600 25px 'Cormorant Garamond',serif;color:var(--brass)}
.price small{font:400 13px 'Vazirmatn';color:var(--mute)}
.meta{color:var(--mute);font-size:14px}
.tag{display:inline-block;font-size:13px;padding:2px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.bad{color:var(--bad);border-color:var(--bad)}
.am{padding:24px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);transition:transform .3s,border-color .3s}
.am:hover{transform:translateY(-4px);border-color:var(--brass)}
.am .ic{width:52px;height:52px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;color:var(--brass);margin-bottom:12px;transition:transform .4s}
.am:hover .ic{transform:rotate(-8deg) scale(1.08)}
.am .ic .ico{width:26px;height:26px}
.am h3{font-size:25px}
.am .tm{color:var(--brass);font-size:14px;margin:4px 0;display:flex;align-items:center;gap:6px}
.gal{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:clamp(120px,18vw,190px);gap:10px}
.gal div{border-radius:12px;overflow:hidden;cursor:zoom-in;background:var(--panel2)}
.gal img{transition:transform .7s}.gal div:hover img{transform:scale(1.08)}
.gal div:nth-child(1),.gal div:nth-child(6){grid-column:span 2;grid-row:span 2}
@media(max-width:700px){.gal{grid-template-columns:1fr 1fr}.gal div:nth-child(n){grid-column:auto;grid-row:auto}.gal div:nth-child(1){grid-column:span 2}}
.rev{padding:24px;border-inline-start:2px solid var(--brass);background:var(--bg);border-radius:0 var(--r) var(--r) 0}
[dir=rtl] .rev{border-radius:var(--r) 0 0 var(--r)}
.rev p{font:italic 500 21px/1.35 'Cormorant Garamond','Vazirmatn',serif}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:30px}
@media(max-width:800px){.contact{grid-template-columns:1fr}}
.contact .row{padding:14px 0;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.contact .row .ico{color:var(--brass);margin-top:4px}
footer{border-top:1px solid var(--line);padding:26px 0;color:var(--mute);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
.wm{color:var(--brass);letter-spacing:.04em}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.74);z-index:60;display:flex;align-items:center;justify-content:center;padding:14px;animation:fade .25s both}
@keyframes fade{from{opacity:0}}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);width:min(500px,100%);max-height:94svh;overflow:auto;padding:24px;animation:pop .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.96)}}
.modal h3{font-size:32px;margin-bottom:14px}
.f{margin-bottom:12px}.f label{display:block;font-size:13px;color:var(--mute);margin-bottom:3px}
.f input,.f select,.f textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:420px){.two{grid-template-columns:1fr}}
.sum{background:var(--bg);border-radius:10px;padding:12px;margin:10px 0;display:flex;justify-content:space-between;gap:10px}
.err{color:var(--bad);font-size:14px;min-height:22px}
.hint{font-size:13px;color:var(--mute);margin:6px 0}
.hp{position:absolute!important;left:-9999px;width:1px;height:1px;opacity:0}
.lb img{object-fit:contain;max-height:92vh;border-radius:10px}
.ok-ring{width:64px;height:64px;border-radius:50%;border:2px solid var(--ok);color:var(--ok);display:grid;place-items:center;margin-bottom:14px;animation:pop .5s both}
.ok-ring .ico{width:32px;height:32px}
/* admin */
.adm{display:grid;grid-template-columns:230px 1fr;min-height:100svh}
.side{background:var(--panel);border-inline-end:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100svh;display:flex;flex-direction:column;gap:4px;overflow:auto}
.side h2{font-size:24px;color:var(--brass);margin-bottom:14px}
.side button{background:none;border:0;text-align:start;padding:11px 12px;border-radius:10px;cursor:pointer;color:var(--mute);display:flex;gap:10px;align-items:center;white-space:nowrap}
.side button.on,.side button:hover{background:var(--panel2);color:var(--ivory)}
.main{padding:clamp(16px,3vw,32px);overflow:auto;min-width:0;animation:fade .3s both}
.main h2{font-size:clamp(30px,4vw,40px);margin-bottom:18px}
@media(max-width:900px){.adm{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:20;height:auto;flex-direction:row;overflow-x:auto;padding:10px;gap:4px;border-inline-end:0;border-bottom:1px solid var(--line)}.side h2{display:none}.side button{padding:9px 12px;flex:none}.side button.push{margin-top:0!important}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:14px;margin-bottom:24px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stat b{font:600 34px 'Cormorant Garamond',serif;color:var(--brass);display:block}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.box h3{font-size:24px;margin-bottom:10px}
.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
.tbl th,.tbl td{text-align:start;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl th{color:var(--mute);font-weight:400}
.tbl select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 7px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.dz{border:2px dashed var(--line);border-radius:var(--r);padding:12px;text-align:center;cursor:pointer;color:var(--mute);transition:.15s;font-size:14px}
.dz.over{border-color:var(--brass);background:rgba(201,165,106,.08)}
.dz .pv{height:130px;border-radius:10px;overflow:hidden;margin-bottom:8px;background:var(--panel2)}
.item{display:grid;grid-template-columns:170px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
@media(max-width:700px){.item,.item[style]{grid-template-columns:1fr!important}}
.log{font-size:14px;padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;flex-wrap:wrap}
.log time{color:var(--mute);white-space:nowrap}
.flag{display:inline-block;font-size:12px;color:var(--bad);border:1px solid var(--bad);border-radius:99px;padding:0 8px;margin-top:3px}
.toast{position:fixed;bottom:20px;inset-inline-start:50%;transform:translateX(-50%);background:var(--brass);color:#1a1409;padding:10px 20px;border-radius:99px;z-index:99;font-weight:600;animation:rise .3s both;max-width:92vw;text-align:center}
/* splash */
.splash{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;background:#0e1512;overflow:auto}
.splash .sbg{position:absolute;inset:0;animation:kb 22s ease-in-out infinite alternate}
.splash .sbg:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(14,21,18,.55),rgba(14,21,18,.95))}
.splash .box2{position:relative;text-align:center;max-width:780px;width:100%;margin:auto}
.splash .brand{width:60px;height:60px;border-radius:50%;border:1px solid var(--brass);color:var(--brass);display:grid;place-items:center;margin:0 auto 20px;animation:pop .7s both}
.splash .brand .ico{width:28px;height:28px}
.splash h1{font-size:clamp(34px,7vw,70px);min-height:1.25em;transition:opacity .4s,transform .4s;text-align:center!important}
.splash h1.sw{opacity:0;transform:translateY(10px)}
.splash .ssub{color:#e2ddcf;font-size:clamp(16px,2.4vw,19px);margin:12px 0 34px;min-height:1.7em;transition:opacity .4s;text-align:center!important}
.langs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.lg{background:rgba(22,32,27,.85);border:1px solid var(--line);border-radius:var(--r);padding:22px 16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:12px;transition:transform .25s,border-color .25s,box-shadow .25s;animation:rise .7s var(--d,0s) cubic-bezier(.2,.7,.2,1) both;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);min-height:44px}
.lg:hover,.lg:focus-visible{transform:translateY(-5px);border-color:var(--brass);box-shadow:0 14px 34px rgba(0,0,0,.4)}
.lg.def{border-color:var(--brass)}
.lg b{font:600 22px 'Vazirmatn',sans-serif}.lg small{color:var(--mute);font-size:13px}
.flag{width:64px;height:43px;border-radius:6px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.45);display:block;flex:none}
.badge{display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);color:var(--brass);font:600 28px 'Vazirmatn',sans-serif}
.splash.out{animation:sout .6s cubic-bezier(.7,0,.3,1) forwards;pointer-events:none}
@keyframes sout{to{opacity:0;transform:scale(1.05);visibility:hidden}}
@media(max-width:640px){.langs{grid-template-columns:1fr}.lg{flex-direction:row;justify-content:flex-start;text-align:start;padding:14px 16px}.lg span.tx{display:flex;flex-direction:column}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K='hotel_site_v2', LK='hotel_lang', AK='hotel_attempts';

/* ---------- built-in photos (referenced as @a..@d so they are not copied into storage) ---------- */
const IMGS={hero:'https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1400&q=70',r1:'https://images.unsplash.com/photo-1631049307264-da0ec9d70304?auto=format&fit=crop&w=1400&q=70',r2:'https://images.unsplash.com/photo-1590490360182-c33d57733427?auto=format&fit=crop&w=1400&q=70',r3:'https://images.unsplash.com/photo-1618773928121-c32242e63f39?auto=format&fit=crop&w=1400&q=70',r4:'https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?auto=format&fit=crop&w=1400&q=70',g1:'https://images.unsplash.com/photo-1564501049412-61c2a3083791?auto=format&fit=crop&w=1400&q=70',g2:'https://images.unsplash.com/photo-1571896349842-33c89424de2d?auto=format&fit=crop&w=1400&q=70',g3:'https://images.unsplash.com/photo-1414235077428-338989a2e8c0?auto=format&fit=crop&w=1400&q=70',g4:'https://images.unsplash.com/photo-1540555700478-4be289fbecef?auto=format&fit=crop&w=1400&q=70',g5:'https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?auto=format&fit=crop&w=1400&q=70',g6:'https://images.unsplash.com/photo-1584132967334-10e028bd69f7?auto=format&fit=crop&w=1400&q=70'};
const src=x=>x&&x[0]==='@'?IMGS[x.slice(1)]:x;
const im=(x,alt='')=>x?`<img src="${esc(src(x))}" alt="${esc(alt)}" loading="lazy" decoding="async" onerror="this.style.display='none'">`:'';

/* ---------- icons ---------- */
const IC={
utensils:'<path d="M4 3v6a3 3 0 0 0 6 0V3M7 3v18M17 21V3c-2.5 1-4 4-4 8 0 2 1 3 4 3"/>',
pool:'<path d="M2 8c2 0 2-2 5-2s3 2 5 2 3-2 5-2 3 2 5 2M2 14c2 0 2-2 5-2s3 2 5 2 3-2 5-2 3 2 5 2M2 20c2 0 2-2 5-2s3 2 5 2 3-2 5-2 3 2 5 2"/>',
spa:'<path d="M12 3c4 3 6 6 6 9a6 6 0 0 1-12 0c0-3 2-6 6-9zM12 21v-9"/>',
car:'<path d="M3 13l2-6h14l2 6v5H3z"/><circle cx="7.5" cy="16" r="1"/><circle cx="16.5" cy="16" r="1"/>',
bell:'<path d="M6 17h12l-1.5-2V10a4.5 4.5 0 0 0-9 0v5zM10 20a2 2 0 0 0 4 0"/>',
wifi:'<path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 20h.01"/>',
gift:'<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M5 12v9h14v-9M12 8c-2-4-6-3-5 0M12 8c2-4 6-3 5 0"/>',
moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>',
users:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.5 0 4 1.5 4 4"/>',
star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
coffee:'<path d="M4 8h13v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4zM17 9h2a2 2 0 0 1 0 5h-2M7 3v2M11 3v2"/>',
dumbbell:'<path d="M6 8v8M3 10v4M18 8v8M21 10v4M6 12h12"/>',
shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',

/* ---------- booking logic + fake-booking protection ---------- */
let search={ci:'',co:'',g:2};
const today=()=>new Date().toISOString().slice(0,10);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const nightsBetween=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const holdMs=()=>S.settings.hold*36e5;
const isExpired=b=>b.status==='pending'&&Date.now()-new Date(b.created)>holdMs();
const holds=b=>b.status!=='cancelled'&&!isExpired(b);
function used(ri,ci,co){return S.bookings.filter(b=>b.room===ri&&holds(b)&&b.ci<co&&b.co>ci).length}
function left(ri,ci,co){return S.rooms[ri].units-(ci&&co?used(ri,ci,co):0)}
function normPhone(p){let d=String(p).replace(/\D/g,'');if(d.startsWith('00964'))d=d.slice(5);else if(d.startsWith('964'))d=d.slice(3);if(d.length===10&&d[0]==='7')d='0'+d;
 if(!/^07[3-9]\d{8}$/.test(d))return null;
 if(/(\d)\1{5,}/.test(d)||/0123456|1234567|2345678|3456789|9876543|8765432/.test(d))return null;return d}
function goodName(n){n=n.trim();if(n.length<3||n.length>60)return false;if(/\d|https?:|www\.|@/i.test(n))return false;if(!/^[\p{L}\p{M}\s.'’-]+$/u.test(n))return false;if(/(.)\1{3,}/u.test(n))return false;
 return n.replace(/[\s.'’-]/g,'').length>=3&&n.split(/\s+/).filter(Boolean).length>=1}
function attempts(){try{return JSON.parse(localStorage.getItem(AK)||'[]').filter(x=>Date.now()-x<36e5)}catch(e){return[]}}
function flags(b){const f=[];const same=S.bookings.filter(x=>x.phone===b.phone).length;if(same>=3)f.push('Repeat number ('+same+')');if(b.secs!=null&&b.secs<10)f.push('Filled very fast');
 if(S.bookings.some(x=>x!==b&&x.name.toLowerCase()===b.name.toLowerCase()&&x.phone!==b.phone))f.push('Same name, other number');return f}

function openBook(i=0){
 const ci=search.ci||addDays(today(),1), co=search.co||addDays(ci,2), opened=Date.now();
 const ov=document.createElement('div');ov.className='ov';
 ov.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><h3>${t('book')}</h3>
 <div class="f"><label>${t('room')}</label><select id="bm-r">${S.rooms.map((r,k)=>`<option value="${k}" ${k==i?'selected':''}>${esc(r.name)} — ${money(r.price)}</option>`).join('')}</select></div>
 <div class="two"><div class="f"><label>${t('ci')}</label><input type="date" id="bm-ci" min="${today()}" value="${ci}"></div><div class="f"><label>${t('co')}</label><input type="date" id="bm-co" min="${today()}" value="${co}"></div></div>
 <div class="f"><label>${t('guests')}</label><input type="number" id="bm-g" min="1" max="10" value="${search.g}" inputmode="numeric"></div>
 <div class="f"><label>${t('name')}</label><input id="bm-n" autocomplete="name" maxlength="60"></div>
 <div class="f"><label>${t('phone')}</label><input id="bm-p" type="tel" dir="ltr" inputmode="tel" autocomplete="tel" placeholder="0750 123 4567" maxlength="20"></div>
 <div class="f"><label>${t('notes')}</label><textarea id="bm-x" rows="2" maxlength="300"></textarea></div>
 <div class="hp" aria-hidden="true"><label>Website</label><input id="bm-hp" tabindex="-1" autocomplete="off"></div>
 <div class="sum"><span>${t('total')}</span><b id="bm-t"></b></div><p class="hint">${ico('shield')} ${t('rule')}</p><div class="err" id="bm-e" role="alert"></div>
 <div style="display:flex;gap:10px"><button class="btn" id="bm-ok" style="flex:1">${t('confirm')}</button><button class="btn ghost" data-close>${t('close')}</button></div></div>`;
 document.body.append(ov);autoDir(ov);
 const calc=()=>{const n=nightsBetween($('#bm-ci',ov).value,$('#bm-co',ov).value),r=S.rooms[$('#bm-r',ov).value];$('#bm-t',ov).textContent=n>0?`${money(n*r.price)} · ${n} ${t('nights')}`:'—'};
 ov.addEventListener('input',calc);calc();
 ov.addEventListener('click',e=>{if(e.target===ov||e.target.closest('[data-close]'))ov.remove()});
 $('#bm-ok',ov).onclick=()=>{
  const ri=+$('#bm-r',ov).value,ci=$('#bm-ci',ov).value,co=$('#bm-co',ov).value,n=$('#bm-n',ov).value.trim().replace(/\s+/g,' '),raw=$('#bm-p',ov).value,g=+$('#bm-g',ov).value,e=$('#bm-e',ov),r=S.rooms[ri];

  if($('#bm-hp',ov).value){log('Blocked attempt','Bot field filled','guest');ov.remove();return}
  const nn=nightsBetween(ci,co);
  if(!(nn>0))return e.textContent=t('bad');
  if(!n||!raw.trim())return e.textContent=t('need');
  if(nn>S.settings.maxNights)return e.textContent=t('long',{n:S.settings.maxNights});
  if(nightsBetween(today(),ci)<0||nightsBetween(today(),ci)>365)return e.textContent=t('far');

  if(S.bookings.some(b=>b.phone===p&&b.room===ri&&b.ci===ci&&b.co===co&&b.status!=='cancelled'))return fail('dup',{},'Duplicate '+p);
  if(S.bookings.filter(b=>b.phone===p&&b.status==='pending'&&!isExpired(b)).length>=2)return fail('pend',{},'Too many pending '+p);
  if(left(ri,ci,co)<1)return e.textContent=t('full');
  const at=attempts();at.push(Date.now());localStorage.setItem(AK,JSON.stringify(at));
  const ref='B'+Date.now().toString(36).toUpperCase().slice(-6);
  const b={ref,room:ri,roomName:r.name,ci,co,g,name:n,phone:p,note:$('#bm-x',ov).value.slice(0,300),total:nn*r.price,status:'pending',created:new Date().toISOString(),secs:Math.round((Date.now()-opened)/1000)};
  S.bookings.unshift(b);log('New booking request',`${ref} · ${n} · ${p} · ${b.roomName} · ${ci} → ${co}`,'guest');
  const msg=encodeURIComponent(`Booking ${ref}\n${b.roomName}\n${ci} → ${co}\n${n} (${p})`);
  $('.modal',ov).innerHTML=`<div class="ok-ring">${ico('check')}</div><h3>${t('done')}</h3><p class="meta">${t('ref')}</p><div class="price" style="margin:4px 0 14px">${ref}</div><p>${esc(b.roomName)}<br>${ci} → ${co} · ${money(b.total)}</p>
  <p class="hint" style="margin-top:12px">${t('hold',{h:S.settings.hold})}</p>
  <p style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap"><a class="btn" target="_blank" rel="noopener" href="https://wa.me/${esc(S.settings.whatsapp)}?text=${msg}">${t('wa')}</a><button class="btn ghost" data-close>${t('close')}</button></p>`;
  autoDir($('.modal',ov));
  if(location.hash.startsWith('#admin'))return;renderSite();
 };
}

function adminAct(a,act){
 if(act==='login'){if(Date.now()<lockUntil){$('#pe').textContent='Too many tries. Wait a minute.';return}
  if($('#pw').value===S.settings.pass){authed=true;fails=0;sessionStorage.setItem('hotel_auth','1');log('Signed in');renderAdmin()}
  else{fails++;if(fails>=5){lockUntil=Date.now()+6e4;fails=0;log('Failed admin login','5 wrong passwords','guest')}$('#pe').textContent='Wrong password.'}return}
 if(!a)return;
 if(act==='tab'){tab=a.dataset.k;renderAdmin()}
 if(act==='logout'){authed=false;sessionStorage.removeItem('hotel_auth');log('Signed out');renderAdmin()}
 if(act==='site'){location.hash=''}
 if(act==='add'){const k=a.dataset.arr;S[k].push(NEW[k]());log('Added',k);save();renderAdmin()}
 if(act==='del'){const k=a.dataset.arr,i=+a.dataset.i;if(!confirm('Delete this item?'))return;const x=S[k][i];S[k].splice(i,1);log('Deleted',`${k}: ${x&&x.name||x&&x.title||x&&x.ref||'item'}`);save();renderAdmin()}
 if(act==='block'){const b=S.bookings[+a.dataset.i];if(!confirm('Block '+b.phone+' from booking online? Their open requests will be cancelled.'))return;if(!S.blocked.includes(b.phone))S.blocked.push(b.phone);S.bookings.forEach(x=>{if(x.phone===b.phone&&x.status==='pending')x.status='cancelled'});log('Blocked number',b.phone);save();renderAdmin()}
 if(act==='unblock'){const p=S.blocked.splice(+a.dataset.i,1)[0];log('Unblocked number',p);save();renderAdmin()}
 if(act==='exportlog'){dl('activity-log.csv','\ufefftime,who,action,detail\n'+S.logs.map(l=>[l.t,l.who,l.action,l.detail].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}
 if(act==='backup'){dl('hotel-backup.json',JSON.stringify(S),'application/json');log('Downloaded backup')}
 if(act==='reset'){if(confirm('This erases all rooms, bookings and logs. Continue?')){S=DEF();save();log('Reset site');renderAdmin()}}
}

 try{const d=await compress(file);const p=box.dataset.dz;setP(p,d);if(save()){log('Changed image',p);renderAdmin();toast('Image updated')}}catch(e){toast('Could not read that image.')}}
document.addEventListener('click',e=>{const b=e.target.closest('.dz');if(b&&e.target.type!=='file')$('input',b).click()});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList?.contains('dz')){e.preventDefault();$('input',e.target).click()}});
document.addEventListener('change',e=>{const b=e.target.closest?.('.dz');if(b)takeFile(b,e.target.files[0]);
 if(e.target.id==='restore'){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.settings)throw 0;S=d;S.blocked=S.blocked||[];save();log('Restored backup');renderAdmin();toast('Backup restored')}catch(x){toast('That file is not a valid backup.')}};r.readAsText(e.target.files[0])}});
['dragover','dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{const b=e.target.closest?.('.dz');if(!b)return;e.preventDefault();b.classList.toggle('over',ev==='dragover');if(ev==='drop')takeFile(b,e.dataTransfer.files[0])}));

render();
</script>
