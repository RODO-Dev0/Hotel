<style>
:root{--bg:#0e1512;--panel:#16201b;--panel2:#1d2a23;--line:#2b3b32;--brass:#c9a56a;--ivory:#f1ece1;--mute:#a3afa7;--bad:#e07a6e;--ok:#6cbf8a;--r:14px;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}

.wrap{max-width:1180px;margin:0 auto;padding-block:0;padding-left:max(clamp(16px,4vw,28px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,4vw,28px),env(safe-area-inset-right,0px))}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.76);z-index:60;display:flex;align-items:center;justify-content:center;padding:14px;animation:fade .25s both}

/* ---------- legal pages ---------- */
function fmtLegal(src,page){
 const V={hotel_name:S.name,legal_name:legalName(),reg_number:S.reg_number,tax_id:S.tax_id,address:S.address,phone:S.phone,email:S.email,checkin:S.checkin_time,checkout:S.checkout_time,hold_hours:S.hold_hours,max_nights:S.max_nights,currency:S.currency,updated:(page.updated_at||'').slice(0,10)};
 const f=l=>esc(l.replace(/\{\{(\w+)\}\}/g,(m,k)=>V[k]??''));
 const empty=l=>[...l.matchAll(/\{\{(\w+)\}\}/g)].some(m=>V[m[1]]===null||V[m[1]]===undefined||V[m[1]]==='');
 let out='',list=false,para=[];
 const fp=()=>{if(para.length){out+='<p>'+para.join(' ')+'</p>';para=[]}},el=()=>{if(list){out+='</ul>';list=false}};
 for(let line of src.split('\n')){line=line.trim();
  if(!line){fp();el();continue}
  if(empty(line))continue;
  if(line.startsWith('# ')){fp();el();out+='<h2>'+f(line.slice(2))+'</h2>'}
  else if(line.startsWith('- ')){fp();if(!list){out+='<ul>';list=true}out+='<li>'+f(line.slice(2))+'</li>'}
  else{el();para.push(f(line))}}
 fp();el();return out}

 autoDir(doc);maybeCookie();

async function checkAvail(){

 try{const r=await call('/rest/v1/rpc/hotel_availability',{method:'POST',body:{p_ci:search.ci,p_co:search.co}});avail={};r.forEach(x=>avail[x.room_id]=x.units_left)}catch(e){avail=null}}
async function refreshRooms(){await checkAvail();const g=$('#roomsGrid');if(g){g.innerHTML=roomsHTML();autoDir(g);reveal()}}
const ERR={bot:'slow',bad_dates:'bad',too_long:'long',bad_room:'full',too_many_guests:'capx',bad_name:'badname',bad_phone:'badphone',too_fast:'slow',no_consent:'noconsent',blocked:'blocked',rate_limit:'rate',duplicate:'dup',too_many_pending:'pend',sold_out:'full',server_busy:'busy'};
function openBook(rid){
 const room0=D.rooms.find(r=>r.id===rid)||D.rooms[0];if(!room0)return;
 const ci=search.ci||addDays(today(),1),co=search.co||addDays(ci,2),opened=Date.now();
 const ov=document.createElement('div');ov.className='ov';
 const L=p=>`<a href="#/legal/${p}" target="_blank" rel="noopener">${esc(legalTitle({slug:p,title:({'terms-of-service':'Terms of Service','privacy-policy':'Privacy Policy','cancellation-policy':'Booking and Cancellation Policy'})[p]}))}</a>`;
 ov.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><h3>${t('book')}</h3>
 <div class="f"><label for="bm-r">${t('room')}</label><select id="bm-r">${D.rooms.map(r=>`<option value="${esc(r.id)}" ${r.id===room0.id?'selected':''}>${esc(r.name)} — ${money(r.price)}</option>`).join('')}</select></div>
 <div class="two"><div class="f"><label for="bm-ci">${t('ci')}</label><input type="date" id="bm-ci" min="${today()}" value="${ci}"></div><div class="f"><label for="bm-co">${t('co')}</label><input type="date" id="bm-co" min="${today()}" value="${co}"></div></div>
 <div class="f"><label for="bm-g">${t('guests')}</label><input type="number" id="bm-g" min="1" max="20" value="${search.g}" inputmode="numeric"></div>
 <div class="f"><label for="bm-n">${t('name')}</label><input id="bm-n" autocomplete="name" maxlength="60"></div>
 <div class="f"><label for="bm-p">${t('phone')}</label><input id="bm-p" type="tel" dir="ltr" inputmode="tel" autocomplete="tel" placeholder="07XX XXX XXXX" maxlength="20"></div>
 <div class="f"><label for="bm-x">${t('notes')}</label><textarea id="bm-x" rows="2" maxlength="300"></textarea></div>
 <div class="hp" aria-hidden="true"><label>Website<input id="bm-hp" tabindex="-1" autocomplete="off"></label></div>
 <div class="sum"><span>${t('total')}</span><b id="bm-t"></b></div>
 <label class="chk"><input type="checkbox" id="bm-c"><span dir="auto">${t('consent',{a:L('terms-of-service'),b:L('privacy-policy'),c:L('cancellation-policy')})}</span></label>
 <p class="hint">${ico('shield')} ${t('rule')}</p><div class="err" id="bm-e" role="alert" dir="auto"></div>
 <div style="display:flex;gap:10px"><button class="btn" id="bm-ok" style="flex:1">${t('confirm')}</button><button class="btn ghost" data-close>${t('close')}</button></div></div>`;
 document.body.append(ov);autoDir(ov);
 const roomOf=()=>D.rooms.find(r=>r.id===$('#bm-r',ov).value);
 const calc=()=>{const n=nightsBetween($('#bm-ci',ov).value,$('#bm-co',ov).value),r=roomOf();$('#bm-t',ov).textContent=n>0&&r?`${money(n*r.price)} · ${n} ${t('nights')}`:'—'};
 ov.addEventListener('input',calc);calc();
 ov.addEventListener('click',e=>{if(e.target===ov||e.target.closest('[data-close]'))ov.remove()});
 const btn=$('#bm-ok',ov);
 btn.onclick=async()=>{
  const r=roomOf(),ci=$('#bm-ci',ov).value,co=$('#bm-co',ov).value,n=$('#bm-n',ov).value.trim().replace(/\s+/g,' '),raw=$('#bm-p',ov).value,g=+$('#bm-g',ov).value,e=$('#bm-e',ov);
  const nn=nightsBetween(ci,co);
  if(!ci||!co||!(nn>0))return e.textContent=t('bad');
  if(!n||!raw.trim())return e.textContent=t('need');
  if(nn>S.max_nights)return e.textContent=t('long',{n:S.max_nights});
  if(nightsBetween(today(),ci)<0||nightsBetween(today(),ci)>365)return e.textContent=t('far');
  if(!(g>=1)||g>r.capacity)return e.textContent=t('capx',{n:r.capacity});
  if(!goodName(n))return e.textContent=t('badname');
  const p=normPhone(raw);if(!p)return e.textContent=t('badphone');
  if(!$('#bm-c',ov).checked)return e.textContent=t('noconsent');
  e.textContent='';btn.disabled=true;
  try{
   const res=await call('/rest/v1/rpc/hotel_create_booking',{method:'POST',body:{p_room:r.id,p_ci:ci,p_co:co,p_guests:g,p_name:n,p_phone:p,p_note:$('#bm-x',ov).value.slice(0,300),p_consent:S.legal_version,p_secs:Math.round((Date.now()-opened)/1000),p_hp:$('#bm-hp',ov).value}});
   if(!res.ok){e.textContent=t(ERR[res.error]||'slow',{n:r.capacity});btn.disabled=false;if(res.error==='sold_out')refreshRooms();return}
   const msg=encodeURIComponent(`Booking ${res.ref}\n${r.name}\n${ci} → ${co}\n${n} (${p})`);
   $('.modal',ov).innerHTML=`<div class="ok-ring">${ico('check')}</div><h3>${t('done')}</h3><p class="meta">${t('ref')}</p><div class="price" style="margin:4px 0 14px" dir="ltr">${esc(res.ref)}</div><p dir="auto">${esc(r.name)}<br>${esc(ci)} → ${esc(co)} · ${money(res.total)}</p>
   <p class="hint" style="margin-top:12px" dir="auto">${t('hold',{h:res.hold_hours})}</p>
   <p style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap"><a class="btn" style="flex:1" target="_blank" rel="noopener noreferrer" href="https://wa.me/${esc(String(S.whatsapp||'').replace(/\D/g,''))}?text=${msg}">${t('wa')}</a><button class="btn ghost" data-close>${t('close')}</button></p>`;
   autoDir($('.modal',ov));if(avail)refreshRooms();
  }catch(x){e.textContent=t('neterr');btn.disabled=false}
 };
}

 if(act==='menu')$('#nav').classList.toggle('open');
 if(act==='book'){$('#nav')?.classList.remove('open');openBook(a.dataset.i)}
 if(act==='credit')showCredit();
 if(act==='cookieok'){store.set(CK,'1');$('.cookie')?.remove();document.body.classList.remove('cb')}
 if(act==='search'){const ci=$('#sci').value,co=$('#sco').value;search={ci,co,g:+$('#sg').value};
  if(ci&&co&&nightsBetween(ci,co)<1){toast(t('bad'));return}
  await refreshRooms();$('#rooms').scrollIntoView()}
 if(act==='lb'){const g=D.gal[+a.dataset.i];if(!g)return;const ov=document.createElement('div');ov.className='ov lb';ov.innerHTML=`${im(g.image_url)}<button aria-label="${t('close')}">${ico('x')}</button>`;ov.onclick=()=>ov.remove();document.body.append(ov)}
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches?.('.gal>div')){e.preventDefault();e.target.click()}if(e.key==='Escape'){$('.lb')?.remove()}});
document.addEventListener('change',e=>{
 if(e.target.id==='lang'){lang=e.target.value;store.set(LK,lang);view==='legal'?renderLegal(legalSlug):view==='404'?render404():renderHome()}
});

boot();
</script>
</body>
</html>
